<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подбор корма — Betty-Bu</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">BETTY<span>-BU</span></a>
    <button class="menu-toggle" aria-label="Меню">☰</button>
    <nav class="dropdown-menu">
      <a href="catalog.html">Каталог</a>
      <a href="calculator.html">Подбор корма</a>
      <a href="bag.html">Заявка <b class="cart-count">0</b></a>
      <a href="about.html">О магазине</a>
    </nav>
  </div>
</header>

<section class="section-heading page-top"><h2>Калькулятор корма</h2></section>
<div class="container narrow">
  <div class="panel">
    <label>Вид питомца
      <select id="type">
        <option value="1">Собака</option>
        <option value="2">Кошка</option>
        <option value="3">Птица</option>
        <option value="4">Рыба</option>
      </select>
    </label>
    <label>Вес питомца, кг <input type="number" id="len" min="0" step="0.1" value="10"></label>
    <button class="btn" id="calc">Рассчитать</button>
    <div class="result" id="result" hidden></div>
  </div>
</div>
<footer class="footer">
  <div class="container footer__inner">
    <div><b>Betty-Bu</b><br>г. Казань, ул. Зоологическая, 5</div>
    <div>+7 (843) 111-22-33<br>info@betty-bu.example</div>
    <div>Ежедневно 08:00–21:00<br>Доставка по городу за 3 часа</div>
  </div>
</footer>
</body>
</html>
