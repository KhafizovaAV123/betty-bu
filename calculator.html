<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор — БетонМикс</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">БЕТОН<span>МИКС</span></a>
    <button class="menu-toggle" aria-label="Меню">☰</button>
    <nav class="dropdown-menu">
      <a href="catalog.html">Каталог</a>
      <a href="calculator.html">Калькулятор</a>
      <a href="bag.html">Заявка <b class="cart-count">0</b></a>
      <a href="about.html">О заводе</a>
    </nav>
  </div>
</header>

<section class="section-heading page-top"><h2>Калькулятор бетона</h2></section>
<div class="container narrow">
  <div class="panel">
    <label>Конструкция
      <select id="type">
        <option value="2">Ленточный фундамент</option>
        <option value="3">Плита перекрытия</option>
        <option value="1">Стяжка пола</option>
        <option value="2">Дорожка / площадка</option>
      </select>
    </label>
    <label>Длина, м <input type="number" id="len" min="0" step="0.1" value="10"></label>
    <label>Ширина, м <input type="number" id="wid" min="0" step="0.1" value="0.4"></label>
    <label>Высота / толщина, м <input type="number" id="hei" min="0" step="0.05" value="0.8"></label>
    <button class="btn" id="calc">Рассчитать</button>
    <div class="result" id="result" hidden></div>
  </div>
</div>
<footer class="footer">
  <div class="container footer__inner">
    <div><b>БетонМикс</b><br>г. Казань, ул. Заводская, 12</div>
    <div>+7 (843) 000-00-00<br>info@betonmix.example</div>
    <div>Ежедневно 07:00–22:00<br>Доставка миксерами 7–10 м³</div>
  </div>
</footer>
</body>
</html>
